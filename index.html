<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه نوبت‌دهی آرایشگاه</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-scissors"></i> نوبت‌دهی آرایشگاه
            </h1>
            <div class="flex gap-2">
                <button onclick="switchTab('client')" id="btnClient" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">رزرو نوبت</button>
                <button onclick="switchTab('admin')" id="btnAdmin" class="bg-indigo-800/60 px-3 py-1.5 rounded-lg text-sm font-medium transition">مدیریت سالن</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-xl">
        
        <!-- CLIENT VIEW -->
        <div id="clientView" class="space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">رزرو نوبت جدید</h2>
                <form id="bookingForm" onsubmit="bookAppointment(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">نام و نام خانوادگی</label>
                        <input type="text" id="clientName" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">شماره تماس</label>
                        <input type="tel" id="clientPhone" required placeholder="0912..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">انتخاب خدمت</label>
                        <select id="serviceSelect" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">تاریخ</label>
                            <input type="date" id="bookingDate" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ساعت</label>
                            <select id="bookingTime" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="10:00">10:00 صبح</option>
                                <option value="11:30">11:30 صبح</option>
                                <option value="14:00">14:00 عصر</option>
                                <option value="16:00">16:00 عصر</option>
                                <option value="18:00">18:00 عصر</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-indigo-200">ثبت و رزرو نوبت</button>
                </form>
            </div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="adminView" class="hidden space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">مدیریت خدمات سالن</h2>
                <form onsubmit="addService(event)" class="flex gap-2 mb-4">
                    <input type="text" id="newServiceName" placeholder="نام خدمت (مثلاً اصلاح سر)" required class="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" id="newServicePrice" placeholder="قیمت (تومان)" required class="w-32 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">افزودن</button>
                </form>
                <div id="servicesList" class="space-y-2">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">لیست نوبت‌های ثبت‌شده</h2>
                <div id="appointmentsList" class="space-y-3">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

    </main>

    <script>
        // LocalStorage Data Init
        let services = JSON.parse(localStorage.getItem('barber_services')) || [
            { id: 1, name: 'اصلاح سر و صورت', price: 150000 },
            { id: 2, name: 'پاکسازی پوست', price: 200000 }
        ];

        let appointments = JSON.parse(localStorage.getItem('barber_appointments')) || [];

        function saveData() {
            localStorage.setItem('barber_services', JSON.stringify(services));
            localStorage.setItem('barber_appointments', JSON.stringify(appointments));
        }

        function switchTab(tab) {
            const clientView = document.getElementById('clientView');
            const adminView = document.getElementById('adminView');
            const btnClient = document.getElementById('btnClient');
            const btnAdmin = document.getElementById('btnAdmin');

            if (tab === 'client') {
                clientView.classList.remove('hidden');
                adminView.classList.add('hidden');
                btnClient.className = 'bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium transition';
                btnAdmin.className = 'bg-indigo-800/60 px-3 py-1.5 rounded-lg text-sm font-medium transition';
                renderServicesDropdown();
            } else {
                clientView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btnAdmin.className = 'bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium transition';
                btnClient.className = 'bg-indigo-800/60 px-3 py-1.5 rounded-lg text-sm font-medium transition';
                renderAdminServices();
                renderAppointments();
            }
        }

        function renderServicesDropdown() {
            const select = document.getElementById('serviceSelect');
            select.innerHTML = '';
            services.forEach(s => {
                select.innerHTML += `<option value="${s.name}">${s.name} - ${s.price.toLocaleString()} تومان</option>`;
            });
        }

        function renderAdminServices() {
            const list = document.getElementById('servicesList');
            list.innerHTML = '';
            services.forEach((s, index) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border text-sm">
                        <span><b>${s.name}</b> - ${s.price.toLocaleString()} تومان</span>
                        <button onclick="deleteService(${index})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addService(e) {
            e.preventDefault();
            const name = document.getElementById('newServiceName').value;
            const price = Number(document.getElementById('newServicePrice').value);
            services.push({ id: Date.now(), name, price });
            saveData();
            document.getElementById('newServiceName').value = '';
            document.getElementById('newServicePrice').value = '';
            renderAdminServices();
            renderServicesDropdown();
        }

        function deleteService(index) {
            services.splice(index, 1);
            saveData();
            renderAdminServices();
            renderServicesDropdown();
        }

        function bookAppointment(e) {
            e.preventDefault();
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const service = document.getElementById('serviceSelect').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            appointments.push({ id: Date.now(), name, phone, service, date, time });
            saveData();
            alert('نوبت شما با موفقیت ثبت شد!');
            document.getElementById('bookingForm').reset();
        }

        function renderAppointments() {
            const list = document.getElementById('appointmentsList');
            if (appointments.length === 0) {
                list.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">هنوز نوبتی ثبت نشده است.</p>';
                return;
            }
            list.innerHTML = '';
            appointments.forEach((app, index) => {
                list.innerHTML += `
                    <div class="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 text-sm space-y-1">
                        <div class="flex justify-between font-bold text-indigo-900">
                            <span>${app.name}</span>
                            <span>${app.phone}</span>
                        </div>
                        <div class="text-gray-600 text-xs">خدمت: ${app.service}</div>
                        <div class="flex justify-between text-gray-500 text-xs pt-1 border-t border-indigo-100">
                            <span>تاریخ: ${app.date}</span>
                            <span>ساعت: ${app.time}</span>
                            <button onclick="deleteAppointment(${index})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteAppointment(index) {
            appointments.splice(index, 1);
            saveData();
            renderAppointments();
        }

        // Initial render
        renderServicesDropdown();
    </script>
</body>
</html>
