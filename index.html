<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو نوبت آرایشگاه</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; line-height: 1.6; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>رزرو نوبت</h2>
    <input type="text" id="name" placeholder="نام و نام خانوادگی">
    <input type="tel" id="phone" placeholder="شماره تماس">
    <button onclick="submitBooking()">ثبت نوبت</button>
    <p id="msg"></p>
</div>

<script>
    const SUPABASE_URL = 'https://eqksnvzqmoleaufwrboe.supabase.co';
    const SUPABASE_KEY = 'GAPGPTMASKTOKEN8drzt2gpinX0X';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function submitBooking() {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const msg = document.getElementById('msg');

        if(!name || !phone) { alert("لطفاً همه فیلدها را پر کنید"); return; }

        const { data, error } = await supabase.from('appointments').insert([{ name, phone }]);
        
        if (error) {
            msg.innerText = "خطا: " + error.message;
        } else {
            msg.innerText = "نوبت شما با موفقیت ثبت شد!";
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
        }
    }
</script>

</body>
</html>
